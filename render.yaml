services:
  - type: web
    name: lsm-scholarship-portal
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_TIMEZONE
        value: America/New_York
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: lsm-scholarship-db
          property: connectionString

databases:
  - name: lsm-scholarship-db
    databaseName: lsm_scholarship
    user: lsm_scholarship
